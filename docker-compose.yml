services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "CryptidCare_Dev1"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CryptidCare_Dev1", "-Q", "SELECT 1", "-No"]
      interval: 10s
      retries: 10
      start_period: 20s
